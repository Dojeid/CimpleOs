# =============================================================================
# Falkon-OS Build & QEMU Engine Configuration (falkon.ini)
# =============================================================================

[qemu]
memory = 512
cpu = qemu64
machine = q35
graphics = std
enable_kvm = false
serial = true
display = sdl

[build]
default_profile = dev
history_limit = 5
cache_enabled = true
log_level = info
security_level = strict  # Enable strict security checks (buffer overflow, integer overflow protection)
compiler_safety_checks = -Wall -Wextra -Werror -Wshadow -Wformat=2 -Wformat-security

[security]
enable_buffer_overflow_protection = true
enable_integer_overflow_protection = true
enable_null_pointer_validation = true
enable_logic_error_correction = true
