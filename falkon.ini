# =============================================================================
# Falkon-OS Build & QEMU Engine Configuration (falkon.ini)
# =============================================================================

[qemu]
memory = 512
cpu = "qemu64"
machine = "q35"
graphics = "std"
enable_kvm = false
serial = true
display = "sdl"

[build]
default_profile = "dev"
history_limit = 5
cache_enabled = true
log_level = "info"
